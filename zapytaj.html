{% extends "base.html" %}

{% block content %}
<h1>Zapytaj AI</h1>

<p class="intro">
    Zadaj pytanie AI. Ta funkcja działa tylko po zalogowaniu.
</p>

<form action="/zapytaj" method="POST">
    <label>Twoje pytanie:</label>

    <textarea
        name="pytanie"
        rows="6"
        maxlength="1000"
        placeholder="Wpisz pytanie..."
    ></textarea>

    <button type="submit">Wyślij</button>
</form>

{% if pytanie %}
<p class="muted">
    <strong>Twoje pytanie:</strong> {{ pytanie }}
</p>
{% endif %}

{% if odpowiedz %}
<div class="answer-box">
    <h2>Odpowiedź</h2>
    <p>{{ odpowiedz }}</p>
</div>
{% endif %}
{% endblock %}
