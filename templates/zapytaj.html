{% extends "base.html" %}

{% block content %}
<h1>Zapytaj AI</h1>

<p class="intro">
    Zadaj pytanie, a Study Helper AI odpowie krótko i konkretnie.
</p>

<form action="/zapytaj" method="POST">
    <label for="pytanie">Twoje pytanie:</label>
    <textarea 
        id="pytanie"
        name="pytanie" 
        rows="6" 
        maxlength="1000" 
        placeholder="Np. Jak przygotować się do egzaminu?"
    >{% if pytanie %}{{ pytanie }}{% endif %}</textarea>

    <button type="submit">Wyślij</button>
</form>

{% if pytanie %}
<p><strong>Twoje pytanie:</strong> {{ pytanie }}</p>
{% endif %}

{% if odpowiedz %}
<div class="answer-box">
    <h2>Odpowiedź</h2>

    <div id="odpowiedz-ai"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const markdownText = {{ odpowiedz|tojson }};
        document.getElementById("odpowiedz-ai").innerHTML = marked.parse(markdownText);
    </script>
</div>
{% endif %}
{% endblock %}
