{% extends "base.html" %}

{% block content %}
<h1>Wygeneruj quiz</h1>

<p class="intro">Wklej notatki, a AI przygotuje quiz A/B/C/D.</p>

<form action="/quiz" method="POST">
    <label>Notatki:</label>
    <textarea name="tekst" rows="10" maxlength="5000" placeholder="Wklej notatki...">{% if tekst %}{{ tekst }}{% endif %}</textarea>
    <button type="submit">Wygeneruj quiz</button>
</form>

{% if blad %}
<div class="answer-box error">
    <p>{{ blad }}</p>
</div>
{% endif %}

{% if wynik %}
<div class="answer-box">
    <h2>Quiz</h2>

    <div id="quiz-wynik"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const markdownText = {{ wynik|tojson }};
        document.getElementById("quiz-wynik").innerHTML = marked.parse(markdownText);
    </script>
</div>
{% endif %}
{% endblock %}
