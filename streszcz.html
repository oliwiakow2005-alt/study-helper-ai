{% extends "base.html" %}

{% block content %}
<h1>Streszcz tekst</h1>

<p class="intro">Wklej tekst, a AI przygotuje krótkie streszczenie.</p>

<form action="/streszcz" method="POST">
    <label>Tekst do streszczenia:</label>
    <textarea name="tekst" rows="10" maxlength="5000" placeholder="Wklej tekst...">{% if tekst %}{{ tekst }}{% endif %}</textarea>
    <button type="submit">Streszcz tekst</button>
</form>

{% if blad %}
<div class="answer-box error">
    <p>{{ blad }}</p>
</div>
{% endif %}

{% if wynik %}
<div class="answer-box">
    <h2>Wynik</h2>
    <p>{{ wynik }}</p>
</div>
{% endif %}
{% endblock %}
